# GitHub Actions CI template

GitHub App permissions for this integration cannot create `.github/workflows/*` directly.

**To enable CI:**
1. In the repo, create `.github/workflows/ci.yml`
2. Paste the contents of `docs/ci-template.yml`
3. Commit on `main`

---

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Python syntax check
        run: python -m compileall backend -q || python -m compileall . -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build frontend (if present)
        run: |
          if [ -d frontend ]; then
            cd frontend
            if [ -f package.json ]; then
              npm install
              npm run build --if-present
            fi
          fi
